[package]
name = "rstcp"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "rstcp"
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[dependencies]
amigaos4 = { path = "../../amigaos4", default-features = false, features = ["dos", "bsdsocket", "timer", "device"] }
